name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One Pages deployment at a time; a newer push to main replaces a queued one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # The job name is the required status check on main - keep it in sync with branch protection.
    name: Build and verify
    runs-on: ubuntu-latest
    env:
      # GitHub Pages serves the site at https://budhap-dev.github.io/LearnAzure/.
      BASE_PATH: /LearnAzure/
      VITE_BUILD_NUMBER: ${{ github.run_number }}
      VITE_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: web

      - name: Lint
        run: npm run lint
        working-directory: web

      # verify-content.mjs runs as part of build: lessons, quizzes, icons, diagrams, glossary.
      - name: Verify content and build
        run: npm run build
        working-directory: web

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
